[package]
name = "payamcrypto"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = "=0.9.0"
jni = { version = "=0.21.1", default-features = false }
base64 = "=0.22.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
