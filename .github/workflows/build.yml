# Tests everything and builds the Android APK.
# - every push / PR: tests + installable debug APK as a workflow artifact
# - tag "v1.2.3": the release APK is signed in a separate, minimal job and published to
#   GitHub Releases as payam.apk (needs repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#   KEY_ALIAS, KEY_PASSWORD — see README).
#
# Supply-chain hygiene: third-party actions are pinned to commit SHAs; the signing key only
# ever enters the "release" job, which runs no caches, no build tools and no third-party code.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci && node --test test.js
        working-directory: server
      - run: bash -n install.sh

  android:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: android/crypto-rs
          cache-bin: true

      - name: Rust toolchain
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Crypto tests
        run: cargo test --release
        working-directory: android/crypto-rs

      - name: Unit tests and APKs
        working-directory: android
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="0.0.${{ github.run_number }}-dev"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            -Ppayam.versionName="$VERSION" -Ppayam.versionCode=${{ github.run_number }}
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/payam-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../out/payam-unsigned.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payam-debug-apk
          path: out/payam-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: payam-unsigned-apk
          path: out/payam-unsigned.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payam-unsigned-apk

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Tag builds need the signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -P 16 -f 4 payam-unsigned.apk payam.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD payam.apk
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --print-certs payam.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          sha256sum payam.apk | cut -d' ' -f1 > payam.apk.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" payam.apk payam.apk.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes
