# English locale for build JVMs: with the Persian Windows locale the Kotlin
# daemon writes Persian digits into its run-files and the client can't connect.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
kotlin.daemon.jvmargs=-Xmx1024m -Duser.language=en -Duser.country=US
kotlin.code.style=official
# AGP 9 built-in Kotlin + KSP (Room) needs the kotlin.sourceSets DSL.
android.disallowKotlinSourceSets=false
